{{ define "main" }}
<div class="min-h-screen flex items-center justify-center bg-[#121212]">
    <div class="text-center">
        <h1 class="text-9xl font-bold text-red-500 mb-4">404</h1>
        <h2 class="text-3xl font-semibold text-gray-100 mb-6">Page Not Found</h2>
        <p class="text-gray-400 mb-8 max-w-md mx-auto">
            The page you're looking for doesn't exist or has been moved. 
            You might want to check the URL or return to the homepage.
        </p>
        <div class="space-x-4">
            <a href="{{ .Site.BaseURL }}" class="inline-block bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded-lg transition-colors">
                Return Home
            </a>
            <a href="{{ .Site.BaseURL }}equipment" class="inline-block bg-[#1A1A1A] hover:bg-[#2A2A2A] text-red-500 font-bold py-2 px-6 rounded-lg transition-colors">
                Browse Equipment
            </a>
        </div>
    </div>
</div>
{{ end }}
