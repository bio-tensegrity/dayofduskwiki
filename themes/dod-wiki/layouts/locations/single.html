{{ define "main" }}
<div class="max-w-7xl mx-auto">
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <!-- Main Content -->
        <div class="lg:col-span-2">
            <h1 class="text-4xl font-bold text-red-500 mb-4">{{ .Title }}</h1>
            
            <!-- Location Image -->
            <div class="bg-[#1A1A1A] rounded-lg p-4 mb-8">
                <img src="{{ .Params.image }}" alt="{{ .Title }}" class="w-full h-auto rounded-lg">
            </div>

            <!-- Location Description -->
            <div class="prose prose-invert max-w-none mb-8">
                {{ .Content }}
            </div>

            <!-- Features -->
            <div class="bg-[#1A1A1A] rounded-lg p-6 mb-8">
                <h2 class="text-2xl font-bold text-red-500 mb-6">Features</h2>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    {{ range .Params.features }}
                    <div class="bg-[#2A2A2A] p-4 rounded-lg">
                        <div class="text-xl font-bold text-white mb-2">{{ .name }}</div>
                        <div class="text-gray-300">{{ .description }}</div>
                    </div>
                    {{ end }}
                </div>
            </div>

            <!-- Points of Interest -->
            <div class="bg-[#1A1A1A] rounded-lg p-6 mb-8">
                <h2 class="text-2xl font-bold text-red-500 mb-6">Points of Interest</h2>
                <div class="prose prose-invert max-w-none">
                    {{ .Params.points_of_interest | markdownify }}
                </div>
            </div>

            <!-- Dangers -->
            <div class="bg-[#1A1A1A] rounded-lg p-6">
                <h2 class="text-2xl font-bold text-red-500 mb-6">Dangers</h2>
                <div class="prose prose-invert max-w-none">
                    {{ .Params.dangers | markdownify }}
                </div>
            </div>
        </div>

        <!-- Sidebar -->
        <!-- Infobox removed as requested -->
    </div>
</div>
{{ end }}
