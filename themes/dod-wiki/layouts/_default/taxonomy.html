{{ define "main" }}
<div class="max-w-3xl mx-auto">
    <h1 class="text-4xl font-bold text-red-500 mb-8">{{ .Title }}</h1>
    <ul>
        {{ range .Pages }}
            <li>
                <a href="{{ .Permalink }}" class="text-red-400 hover:underline">{{ .Title }}</a>
            </li>
        {{ end }}
    </ul>
</div>
{{ end }}
